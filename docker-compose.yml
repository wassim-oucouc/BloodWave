services:

  # =======================
  # PostgreSQL
  # =======================
  db:
    image: postgres:17
    container_name: BloodWave-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123123
      POSTGRES_DB: BloodWave
    ports:
      - "5481:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bloodwave-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
  # =======================
  # PgAdmin
  # =======================
  pgadmin:
    image: dpage/pgadmin4
    container_name: BloodWave-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "9090:80"
    depends_on:
      - db
volumes:
  postgres_data:
  redis-data: